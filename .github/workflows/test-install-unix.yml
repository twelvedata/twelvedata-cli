name: Test Unix Installer

on:
  pull_request:
    paths:
      - install.sh
      - .github/workflows/test-install-unix.yml
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Run install.sh from repo
        run: bash install.sh

      - name: Verify binary exists
        run: |
          exe="$HOME/.twelvedata/bin/twelvedata"
          if [ ! -f "$exe" ]; then
            echo "Binary not found at $exe"
            exit 1
          fi
          echo "Found binary at $exe"

      - name: Verify binary runs
        run: |
          "$HOME/.twelvedata/bin/twelvedata" --version
          "$HOME/.twelvedata/bin/twelvedata" --help
