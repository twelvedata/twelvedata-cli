name: Test Unix Installer

on:
  pull_request:
    paths:
      - install.sh
      - .github/workflows/test-install-unix.yml
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest      # linux-x64
          - ubuntu-24.04-arm   # linux-arm64
          - macos-13           # darwin-x64 (Intel)
          - macos-14           # darwin-arm64 (Apple Silicon)
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Run install.sh from repo
        run: bash install.sh

      - name: Verify binary exists
        run: |
          exe="$HOME/.twelvedata/bin/twelvedata"
          if [ ! -f "$exe" ]; then
            echo "Binary not found at $exe"
            exit 1
          fi
          echo "Found binary at $exe"

      - name: Verify binary runs
        run: |
          exe="$HOME/.twelvedata/bin/twelvedata"
          "$exe" --version
          "$exe" --help

      - name: Verify schema dump (no API key required)
        run: |
          exe="$HOME/.twelvedata/bin/twelvedata"
          out=$("$exe" schema)
          if [ -z "$out" ]; then
            echo "schema output was empty"
            exit 1
          fi
          # Sanity-check the dump is the expected JSON shape.
          printf '%s' "$out" | grep -q '"path"' || {
            echo 'schema JSON missing "path" field'
            printf '%s\n' "$out" | head -c 400
            exit 1
          }
          echo "schema dump ok ($(printf '%s' "$out" | wc -c) bytes)"
