version: 2

project_name: twelvedata-cli

before:
  hooks:
    - go mod tidy

builds:
  - id: twelvedata
    main: ./cmd/twelvedata
    binary: twelvedata
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/twelvedata/twelvedata-cli/internal/version.Version={{ .Version }}

archives:
  - id: twelvedata
    ids:
      - twelvedata
    name_template: 'twelvedata-{{ .Os }}-{{ if eq .Arch "amd64" }}x64{{ else }}{{ .Arch }}{{ end }}'
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    files:
      - LICENSE
      - README.md

checksum:
  name_template: checksums.txt

# Keyless signing of checksums.txt via cosign + Sigstore. Produces
# checksums.txt.sig and checksums.txt.pem alongside the checksums file.
# Identity is the GitHub Actions workflow that ran the release — verifiers
# pin it to .github/workflows/release.yml on a v* tag.
signs:
  - cmd: cosign
    certificate: '${artifact}.pem'
    args:
      - sign-blob
      - '--output-certificate=${certificate}'
      - '--output-signature=${signature}'
      - '${artifact}'
      - '--yes'
    artifacts: checksum
    output: true

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  use: github
  groups:
    - title: Features
      regexp: '^.*?feat(\(.+\))??!?:.+$'
      order: 0
    - title: Bug fixes
      regexp: '^.*?fix(\(.+\))??!?:.+$'
      order: 1
    - title: Documentation
      regexp: '^.*?docs(\(.+\))??!?:.+$'
      order: 2
    - title: Other
      order: 999
  filters:
    exclude:
      - '^test:'
      - '^chore:'
      - '^ci:'
      - '^style:'
      - '^refactor:'

release:
  github:
    owner: twelvedata
    name: twelvedata-cli
  draft: false
  prerelease: auto
  mode: replace
  header: |
    ## Install

    **cURL (macOS / Linux)**
    ```sh
    curl -fsSL https://raw.githubusercontent.com/twelvedata/twelvedata-cli/main/install.sh | bash
    ```

    **Homebrew (macOS / Linux)**
    ```sh
    brew install twelvedata/cli/twelvedata
    ```

    **PowerShell (Windows)**
    ```sh
    irm https://raw.githubusercontent.com/twelvedata/twelvedata-cli/main/install.ps1 | iex
    ```

    **Go**
    ```sh
    go install github.com/twelvedata/twelvedata-cli/cmd/twelvedata@{{ .Tag }}
    ```

# Homebrew tap — bumps Casks/twelvedata.rb in twelvedata/homebrew-cli on
# every stable release. Skipped for pre-releases (skip_upload: auto). Requires
# the HOMEBREW_TAP_GITHUB_TOKEN secret on the twelvedata-cli repo.
#
# The post-install hook strips the macOS quarantine xattr so the binary is
# runnable without a Gatekeeper prompt — the goreleaser pipeline does not
# notarize the darwin builds.
homebrew_casks:
  - name: twelvedata
    binaries:
      - twelvedata
    repository:
      owner: twelvedata
      name: homebrew-cli
      branch: main
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    commit_author:
      name: twelvedata-ci
      email: no-reply@twelvedata.com
    commit_msg_template: "Bump twelvedata-cli version to {{ .Tag }}"
    homepage: https://twelvedata.com
    description: Twelve Data CLI — the official command-line client for the Twelve Data API,
    skip_upload: auto
    # Generate shell completion scripts at brew-install time and stage them
    # into brew's standard completion paths. bash users with bash-completion@2
    # installed pick them up automatically; zsh and fish users get them free.
    # Avoids the user having to run `twelvedata completion install` separately.
    generate_completions_from_executable:
      # Path is relative to the cask's staged_path, which is the root of the
      # tarball — same level as `binary "twelvedata"`. Adding a `bin/` prefix
      # produces "command not found: bin/twelvedata" at brew install time.
      executable: "twelvedata"
      # No `args:` — `shell_parameter_format: cobra` already invokes
      # `<binary> completion <shell>`. Adding `completion` to args doubles it
      # up: `twelvedata completion completion bash`.
      base_name: "twelvedata"
      shell_parameter_format: cobra
      shells: [bash, zsh, fish, pwsh]
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/twelvedata"]
          end
